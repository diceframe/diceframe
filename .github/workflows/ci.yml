name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # PR 上分 3 片并行跑（每片内部仍是 -n auto 的 4 worker）；覆盖率的插桩
    # 开销只留在 main 推送的整片运行里。下面的 backend-gate 保持「Backend
    # tests」这个必需检查名不变，仓库合并门禁无需改动。
    name: Backend tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install CJK font for bot card rendering
        # Bot 卡片渲染要求真实 CJK 字形（与 Docker 镜像一致）；测试环境没有
        # 字体时相关用例会 skip，装了字体才能在 CI 真正覆盖中文渲染路径。
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Lint with ruff
        run: python -m ruff check src/

      - name: Type check with mypy
        # 按 pyproject [tool.mypy].files 限定范围（当前 5 个已通过文件），
        # 不加路径参数。全量 src/ 有历史类型债，用 files 白名单渐进扩展。
        run: python -m mypy

      - name: Validate Windows portable dependency lock
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_portable_lock.py
          python -m pip download \
            --dest "${RUNNER_TEMP}/diceframe-portable-lock" \
            --only-binary=:all: \
            --platform win_amd64 \
            --python-version 3.11 \
            --implementation cp \
            --abi cp311 \
            --require-hashes \
            -r requirements-portable.lock

      - name: Run backend tests (shard ${{ matrix.shard }}/3)
        # 按测试文件分发给 runner 的所有核心：整套约 550 个文件、上万条用例，
        # 串行会吃掉 45 分钟预算的大部分。--dist loadfile 让同一文件的用例
        # 始终落在同一个 worker，模块内 fixture 与共享状态语义与串行一致；
        # pytest-split 再把用例集合按片切给不同 runner，墙钟约 40→15 分钟。
        # 覆盖率不在分片里跑（插桩约占 15-25% 且产物只打印到日志），由 main
        # 上独立的 backend-coverage job 全量执行。
        run: >-
          python -m pytest -q -n auto --dist loadfile
          --splits 3 --group ${{ matrix.shard }}
          --durations=15

  backend-coverage:
    # 只随 main 推送跑全量 + 覆盖率：PR 走 3 分片快速反馈，覆盖率日志不在
    # 合并关键路径上。
    name: Backend coverage (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install CJK font for bot card rendering
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run backend tests with coverage
        run: >-
          python -m pytest -q -n auto --dist loadfile
          --cov=src --cov-report=term-missing --cov-report=xml
          --durations=15

  backend-gate:
    # 名称必须保持为「Backend tests」：仓库的分支规则以它作为必需检查，
    # 分片 job 的名字带后缀，由这里汇总最终结论。
    name: Backend tests
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every backend shard passed
        run: |
          echo "backend result: ${{ needs.backend.result }}"
          if [ "${{ needs.backend.result }}" != "success" ]; then
            exit 1
          fi

  launcher-windows:
    name: Launcher tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    # 启动器回归必须落在 Windows runner：它们用 .NET Framework 的编译器现场编译
    # 裸 exe，再复现 TLS 1.2 默认值与大小写重复环境块这两类只在本机出现的事故。
    # ubuntu 上这些用例会 skip，CI 全绿并不代表启动器被测过。

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify .NET Framework compiler
        shell: pwsh
        run: |
          python -c "from scripts import build_launcher; print(build_launcher.find_csc())"

      - name: Pre-fetch pinned WebView2 SDK
        # 测试里离线取不到 SDK 会 skip；这里先取一次，让网络/校验失败直接把 job 变红。
        run: python -c "from scripts import build_launcher; print(build_launcher.ensure_webview2_sdk())"

      - name: Run launcher regression tests
        # test_launcher_promotion：运行中 exe 的改名/覆写约束只有真实 Windows 才有；
        # test_launcher_lifecycle：真实编译的启动器 + 假后端，覆盖接管、更新/回滚、
        # 停止超时、运行中自重启与双安装冲突。
        run: >-
          python -m pytest -q
          tests/test_build_launcher.py
          tests/test_launcher_promotion.py
          tests/test_launcher_lifecycle.py

  embedding-runtime:
    name: Packaged embedding inference (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-portable.lock
            requirements-docker-amd64.lock

      - name: Test embedded Windows Python after package cleanup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'diceframe-embedded-python'
          python -c "import sys; from pathlib import Path; from scripts import build_portable as p; p.install_python_runtime(Path(sys.argv[1]), p.DEFAULT_PYTHON_VERSION, p.python_embed_url(p.DEFAULT_PYTHON_VERSION), p.DEFAULT_PYTHON_SHA256, p.PIP_BOOTSTRAP_URL, p.PIP_BOOTSTRAP_SHA256)" $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $runtime 'python.exe') -I scripts/smoke_test_local_embedding.py .

      - name: Test isolated managed Docker payload dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          site_packages="${RUNNER_TEMP}/diceframe-docker-site-packages"
          python -c 'import sys; from pathlib import Path; from scripts import build_docker_update as d; d.install_runtime(Path(sys.argv[1]))' "$site_packages"
          python -I -S scripts/smoke_test_local_embedding.py . "$site_packages"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend-v2

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check core translations and community fallback
        run: npm run locales:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build

  browser-smoke:
    name: Browser smoke tests
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FIX-07 §9：浏览器 smoke 不允许 continue-on-error —— 它必须能让总 workflow 变红，
    # 否则 PR 上的假绿会掩盖真实的浏览器回归。

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-v2/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --prefix frontend-v2
          npm --prefix frontend-v2 exec playwright install --with-deps chromium

      - name: Run clean-data browser tests
        working-directory: frontend-v2
        env:
          DICEFRAME_E2E_SERVER_LOG: ${{ github.workspace }}/frontend-v2/test-results/server.log
        run: npm run test:e2e:smoke

      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-smoke-results
          path: frontend-v2/test-results/
          retention-days: 7
          if-no-files-found: ignore
