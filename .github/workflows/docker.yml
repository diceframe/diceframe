name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit image tag, for example 2.3.0 or 2.3.0-beta.1"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare image tags
        id: meta
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            update_latest="true"
          else
            version="${{ inputs.version }}"
            update_latest="false"
          fi
          version="${version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: ${version}" >&2
            exit 1
          fi
          if [[ "${version}" == *-* ]]; then
            update_latest="false"
          fi
          ghcr_image="ghcr.io/${owner}/diceframe"
          dockerhub_image="docker.io/falconku/diceframe"
          tags="${ghcr_image}:${version},${dockerhub_image}:${version}"
          if [[ "${update_latest}" == "true" ]]; then
            tags="${tags},${ghcr_image}:latest,${dockerhub_image}:latest"
          fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
