name: diceframe

services:
  web:
    build:
      context: .
    image: ghcr.io/diceframe/diceframe:latest
    container_name: diceframe-web
    ports:
      - "${DICEFRAME_HTTP_PORT:-9876}:9876"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRPG_WEB_HOST: "0.0.0.0"
      TRPG_WEB_PORT: "9876"
      TRPG_DATA_DIR: "/app/data"
      # The image already defaults to Asia/Shanghai; set TZ in .env to change it.
      TZ: "${TZ:-Asia/Shanghai}"

      TRPG_ACCESS_TOKEN: "${TRPG_ACCESS_TOKEN:-}"
      TRPG_WEB_CORS_ORIGINS: "${TRPG_WEB_CORS_ORIGINS:-}"
      TRPG_PROXY_URL: "${TRPG_PROXY_URL:-}"

      TRPG_BOT_TOKEN: "${TRPG_BOT_TOKEN:-}"
      NAPCAT_HOST: "${NAPCAT_HOST:-}"
      NAPCAT_PORT: "${NAPCAT_PORT:-}"
      NAPCAT_TOKEN: "${NAPCAT_TOKEN:-}"
    volumes:
      - ./data:/app/data
      - ./plugins:/app/plugins
    restart: unless-stopped
