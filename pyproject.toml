[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The repository still contains a backlog of style-only findings.  Keep the
# mandatory gate focused on correctness while those are paid down separately.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
files = [
    "src/engine/contracts.py",
    "src/plugin_host/content.py",
    "src/plugin_host/descriptors.py",
    "src/webui/config_update.py",
    "src/webui/services/turns.py",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
